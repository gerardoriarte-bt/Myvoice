server {
    listen 80;
    server_name _;

    # Increase for PDF uploads (15 MB)
    client_max_body_size 20m;

    # ── Frontend (SPA) ───────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea: es el que referencia los bundles con hash.
    # Sin esto el navegador sirve un index viejo apuntando a assets inexistentes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options       SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy       strict-origin-when-cross-origin;
    }

    # Los assets llevan hash en el nombre: cachear agresivamente es seguro.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options       SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy       strict-origin-when-cross-origin;
    }

    # ── Backend API ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming — disable buffering, extend timeouts
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        keepalive_timeout  300s;
    }

    # ── Health check ─────────────────────────────────────────────
    location /health {
        proxy_pass http://backend:3001/health;
    }

    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options       SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy       strict-origin-when-cross-origin;
}
